<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User Story - Superhero</title>
    <!-- Bootswatch Superhero Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/superhero/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --superhero-accent: #df691a;
            --superhero-dark-bg: #4e5d6c;
            --superhero-light-text: #ebf1f6;
            --superhero-column-bg: #373a3c;
        }

        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            background-color: var(--bs-body-bg);
        }

        body {
            font-family: 'Roboto Condensed', sans-serif;
        }

        .main-content {
            flex-grow: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .story-form-container {
            background-color: var(--superhero-column-bg);
            padding: 2rem;
            border-radius: 10px;
            border: 1px solid var(--bs-gray-600);
        }

        .form-section-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--superhero-accent);
            border-bottom: 2px solid var(--superhero-accent);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .input-group-text {
            font-weight: 700;
            background-color: var(--superhero-dark-bg);
            color: var(--superhero-light-text);
            border-color: var(--bs-gray-600);
        }

        .acceptance-criterion {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        footer {
            background-color: var(--bs-dark);
            color: var(--bs-gray-500);
            padding: 1rem;
            text-align: center;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#" style="font-family: 'Orbitron', sans-serif;">Kanban</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                         <a class="nav-link" href="#">Board</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Create Story</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="projectDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Project Alpha
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="projectDropdown" id="projectList">
                           <li><a class="dropdown-item" href="#">Project Alpha</a></li>
                           <li><a class="dropdown-item" href="#">Project Beta</a></li>
                           <li><a class="dropdown-item" href="#">Project Gamma</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="story-form-container">
                <h2 class="form-section-title">New User Story</h2>
                <form id="storyForm">
                    <!-- User Story Core -->
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text">As A</span>
                            <input type="text" class="form-control" id="userRole" placeholder="e.g., Registered User" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="input-group">
                             <span class="input-group-text">I Want To</span>
                            <input type="text" class="form-control" id="userAction" placeholder="e.g., Save my profile picture" required>
                        </div>
                    </div>
                     <div class="mb-4">
                        <div class="input-group">
                             <span class="input-group-text">So That</span>
                            <input type="text" class="form-control" id="userBenefit" placeholder="e.g., Personalize my account" required>
                        </div>
                    </div>

                    <!-- Acceptance Criteria -->
                    <h4 class="form-section-title mt-5">Acceptance Criteria</h4>
                    <div id="acceptanceCriteriaContainer">
                        <div class="acceptance-criterion">
                            <input type="text" class="form-control" placeholder="Given... When... Then..." required>
                            <button type="button" class="btn btn-sm btn-danger remove-criterion-btn"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <button type="button" id="addCriterionBtn" class="btn btn-secondary mt-2"><i class="fas fa-plus"></i> Add Criterion</button>

                    <!-- Details -->
                    <h4 class="form-section-title mt-5">Details</h4>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                             <label for="storyValue" class="form-label">Value</label>
                             <select class="form-select" id="storyValue">
                                <option>High</option>
                                <option selected>Medium</option>
                                <option>Low</option>
                            </select>
                        </div>
                         <div class="col-md-4 mb-3">
                             <label for="storyEffort" class="form-label">Effort (T-Shirt)</label>
                             <select class="form-select" id="storyEffort">
                                <option>XS</option>
                                <option>S</option>
                                <option selected>M</option>
                                <option>L</option>
                                <option>XL</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="storyNotes" class="form-label">Notes & Conversation Points</label>
                        <textarea class="form-control" id="storyNotes" rows="4" placeholder="Capture questions, assumptions, and technical notes here..."></textarea>
                    </div>

                    <!-- Actions -->
                    <div class="d-flex justify-content-end gap-2 mt-5">
                        <button type="button" class="btn btn-outline-secondary">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Story</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark">
        <p class="mb-0">&copy; 2024 Kanban Project Management. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const addCriterionBtn = document.getElementById('addCriterionBtn');
            const criteriaContainer = document.getElementById('acceptanceCriteriaContainer');
            const storyForm = document.getElementById('storyForm');

            // Add new acceptance criterion field
            addCriterionBtn.addEventListener('click', () => {
                const newCriterion = document.createElement('div');
                newCriterion.className = 'acceptance-criterion';
                newCriterion.innerHTML = `
                    <input type="text" class="form-control" placeholder="Given... When... Then..." required>
                    <button type="button" class="btn btn-sm btn-danger remove-criterion-btn"><i class="fas fa-trash"></i></button>
                `;
                criteriaContainer.appendChild(newCriterion);
            });

            // Remove acceptance criterion field (using event delegation)
            criteriaContainer.addEventListener('click', (e) => {
                // Find the closest remove button
                const removeBtn = e.target.closest('.remove-criterion-btn');
                if (removeBtn) {
                    removeBtn.parentElement.remove();
                }
            });

            // Handle form submission
            storyForm.addEventListener('submit', (e) => {
                e.preventDefault();

                // Collect acceptance criteria
                const criteriaInputs = criteriaContainer.querySelectorAll('input[type="text"]');
                const acceptanceCriteria = [];
                criteriaInputs.forEach(input => {
                    if (input.value.trim() !== '') {
                        acceptanceCriteria.push(input.value.trim());
                    }
                });

                // Construct the story object
                const userStory = {
                    role: document.getElementById('userRole').value,
                    action: document.getElementById('userAction').value,
                    benefit: document.getElementById('userBenefit').value,
                    acceptanceCriteria: acceptanceCriteria,
                    value: document.getElementById('storyValue').value,
                    effort: document.getElementById('storyEffort').value,
                    notes: document.getElementById('storyNotes').value
                };

                // For demonstration, log the story object to the console
                // In a real application, you would send this to a server
                console.log("User Story Created:", userStory);
                alert('User Story Saved! Check the browser console for the data.');

                // Optional: Reset the form after submission
                storyForm.reset();
                // Clear all but the first acceptance criterion
                while(criteriaContainer.children.length > 1) {
                    criteriaContainer.removeChild(criteriaContainer.lastChild);
                }

            });
        });
    </script>
</body>
</html>
