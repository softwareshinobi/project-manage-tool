<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management - Superhero</title>
    <!-- Bootswatch Superhero Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/superhero/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.bootstrap5.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/3.0.2/css/buttons.bootstrap5.css">
    <!-- Flatpickr Date Picker CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --superhero-accent: #df691a;
            --superhero-dark-bg: #4e5d6c;
            --superhero-light-text: #ebf1f6;
            --superhero-column-bg: #373a3c;
        }

        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            background-color: var(--bs-body-bg);
        }

        body {
            font-family: 'Roboto Condensed', sans-serif;
        }

        .main-content {
            flex-grow: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .management-container {
             background-color: var(--superhero-column-bg);
             padding: 2rem;
             border-radius: 10px;
        }

        .table th {
            font-family: 'Orbitron', sans-serif;
        }

        .table td {
            vertical-align: middle;
        }

        .editable-cell {
            cursor: pointer;
        }

        .editable-cell:hover {
            background-color: var(--superhero-dark-bg);
        }

        .progress {
            background-color: var(--superhero-dark-bg);
        }

        .action-btn {
            color: var(--bs-gray-400);
            text-decoration: none;
            margin: 0 0.25rem;
            transition: color 0.2s ease;
            cursor: pointer;
            font-size: 1.1rem;
        }
        .action-btn:hover {
            color: var(--bs-light);
        }
        .action-btn.delete:hover {
            color: var(--bs-danger);
        }
        .action-btn.save:hover {
            color: var(--bs-success);
        }
        .action-btn.edit:hover {
            color: var(--bs-info);
        }
        .action-btn.kanban:hover, .action-btn.dashboard:hover {
             color: var(--superhero-accent);
        }


        footer {
            background-color: var(--bs-dark);
            color: var(--bs-gray-500);
            padding: 1rem;
            text-align: center;
            flex-shrink: 0;
        }

        /* DataTables buttons styling */
        .dt-buttons .btn-secondary {
            background-color: var(--superhero-accent);
            border-color: var(--superhero-accent);
        }

        /* Custom tab styles */
        .nav-tabs .nav-link {
            color: var(--bs-gray-400);
        }
        .nav-tabs .nav-link.active {
            color: var(--superhero-accent);
            background-color: var(--superhero-column-bg);
            border-color: var(--superhero-column-bg) var(--superhero-column-bg) #fff;
        }

    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#" style="font-family: 'Orbitron', sans-serif;">ProjectManager</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="view-tab" data-bs-toggle="tab" data-bs-target="#view-tab-pane" type="button" role="tab">View Projects</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="add-tab" data-bs-toggle="tab" data-bs-target="#add-tab-pane" type="button" role="tab">Add Project</button>
                </li>
            </ul>
            <div class="tab-content" id="myTabContent">
                <!-- View Projects Tab -->
                <div class="tab-pane fade show active" id="view-tab-pane" role="tabpanel">
                    <div class="management-container mt-3">
                        <h2 style="font-family: 'Orbitron', sans-serif;">Existing Projects</h2>
                        <div class="table-responsive">
                            <table id="projectTable" class="table table-dark table-hover" style="width:100%">
                                <thead>
                                    <tr>
                                        <th>Project Name</th>
                                        <th>Progress</th>
                                        <th>Lead</th>
                                        <th>Target End Date</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <!-- Add Project Tab -->
                <div class="tab-pane fade" id="add-tab-pane" role="tabpanel">
                    <div class="management-container mt-3">
                        <h2 style="font-family: 'Orbitron', sans-serif;">Add New Project</h2>
                        <form id="addProjectForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="projectName" class="form-label">Project Name</label>
                                    <input type="text" class="form-control" id="projectName" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="projectLead" class="form-label">Project Lead</label>
                                    <select class="form-select" id="projectLead" required></select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="projectStatus" class="form-label">Status</label>
                                    <select class="form-select" id="projectStatus">
                                        <option>Planning</option>
                                        <option>In Progress</option>
                                        <option>Completed</option>
                                        <option>On Hold</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="targetEndDate" class="form-label">Target End Date</label>
                                    <input type="text" class="form-control" id="targetEndDate" placeholder="Select a date...">
                                </div>
                                <div class="col-12 mb-3">
                                    <label for="projectDescription" class="form-label">Description</label>
                                    <textarea class="form-control" id="projectDescription" rows="3"></textarea>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">Add Project</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark">
        <p class="mb-0">&copy; 2024 Project Management. All Rights Reserved.</p>
    </footer>

    <!-- Delete Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Confirm Deletion</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            Are you sure you want to delete project <strong id="projectToDeleteName"></strong>?
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables -->
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.bootstrap5.js"></script>
    <script src="https://cdn.datatables.net/buttons/3.0.2/js/dataTables.buttons.js"></script>
    <script src="https://cdn.datatables.net/buttons/3.0.2/js/buttons.bootstrap5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/3.0.2/js/buttons.html5.min.js"></script>
    <!-- Flatpickr -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script>
        $(document).ready(function() {
            // --- Configuration Data ---
            const teamMembers = ['Alex W.', 'Leila H.', 'Sam C.', 'John D.'];
            const statusConfig = {
                'Planning': { progress: 10, class: 'bg-secondary' },
                'In Progress': { progress: 50, class: 'bg-info' },
                'On Hold': { progress: 75, class: 'bg-warning' },
                'Completed': { progress: 100, class: 'bg-success' }
            };

            // --- Initial Data ---
            const initialData = [
                { id: 1, name: 'Project Alpha', lead: 'Alex W.', status: 'In Progress', targetEndDate: '2024-08-30', description: 'Integrate a new payment gateway.' },
                { id: 2, name: 'Project Beta', lead: 'Leila H.', status: 'Planning', targetEndDate: '2024-10-15', description: 'Develop the Q3 marketing campaign.' },
                { id: 3, name: 'Project Gamma', lead: 'Sam C.', status: 'Completed', targetEndDate: '2024-05-01', description: 'Initial setup and repository configuration.' },
            ];

            // --- Populate Dropdowns & Date Pickers ---
            function populateLeadDropdown(selector) {
                const dropdown = $(selector);
                dropdown.empty();
                teamMembers.forEach(member => {
                    dropdown.append($('<option>', { value: member, text: member }));
                });
            }
            populateLeadDropdown('#projectLead');
            flatpickr("#targetEndDate", { dateFormat: "Y-m-d" });

            // --- DataTables Initialization ---
            const table = $('#projectTable').DataTable({
                data: initialData,
                columns: [
                    { data: 'name', className: 'editable-cell' },
                    {
                        data: 'status',
                        className: 'editable-cell',
                        render: function(data, type) {
                            if (type === 'display') {
                                const config = statusConfig[data] || { progress: 0, class: 'bg-dark' };
                                return `
                                    <div class="progress" style="height: 25px;">
                                      <div class="progress-bar progress-bar-striped progress-bar-animated ${config.class}" role="progressbar" style="width: ${config.progress}%" aria-valuenow="${config.progress}" aria-valuemin="0" aria-valuemax="100">${data}</div>
                                    </div>
                                `;
                            }
                            return data;
                        }
                    },
                    { data: 'lead', className: 'editable-cell' },
                    { data: 'targetEndDate', className: 'editable-cell' },
                    {
                        data: null, className: 'text-end', orderable: false,
                        render: () => `
                            <a class="action-btn kanban" title="Kanban Board"><i class="fas fa-columns"></i></a>
                            <a class="action-btn dashboard" title="Dashboard"><i class="fas fa-chart-line"></i></a>
                            <a class="action-btn edit" title="Edit"><i class="fas fa-pencil-alt"></i></a>
                            <a class="action-btn save" title="Save" style="display: none;"><i class="fas fa-save"></i></a>
                            <a class="action-btn delete" title="Delete"><i class="fas fa-trash"></i></a>
                        `
                    }
                ],
                layout: { topStart: { buttons: ['csv', 'excel'] } }
            });

            const deleteModalEl = document.getElementById('deleteModal');
            const deleteModal = new bootstrap.Modal(deleteModalEl);
            let rowBeingEdited = null;

            // --- Event Handlers ---

            $('#addProjectForm').on('submit', function(e) {
                e.preventDefault();
                const newProject = {
                    id: Date.now(),
                    name: $('#projectName').val(),
                    lead: $('#projectLead').val(),
                    status: $('#projectStatus').val(),
                    targetEndDate: $('#targetEndDate').val(),
                    description: $('#projectDescription').val()
                };
                table.row.add(newProject).draw();
                this.reset();
            });

            $('#projectTable tbody').on('click', 'td, a', function(e) {
                const cell = $(this).closest('td');
                const row = $(this).closest('tr');
                const actionBtn = $(e.target).closest('a');

                if (actionBtn.length) {
                    e.stopPropagation();
                    const action = actionBtn.attr('title');
                    const data = table.row(row).data();

                    if (action === 'Delete') {
                        $('#projectToDeleteName').text(data.name);
                        deleteModal.show();
                        $('#confirmDeleteBtn').off('click').on('click', () => { table.row(row).remove().draw(); deleteModal.hide(); });
                    } else if (action === 'Edit') {
                        if (rowBeingEdited && !row.is(rowBeingEdited)) saveRow(rowBeingEdited);
                        rowBeingEdited = row;
                        row.find('.edit, .kanban, .dashboard').hide();
                        row.find('.save').show();
                        row.find('td.editable-cell').each(function() { makeCellEditable($(this)); });
                    } else if (action === 'Save') {
                        saveRow(row);
                        rowBeingEdited = null;
                    } else if (action === 'Kanban Board') {
                        alert(`Navigating to Kanban Board for project: "${data.name}"`);
                    } else if (action === 'Dashboard') {
                         alert(`Navigating to Dashboard for project: "${data.name}"`);
                    }

                } else if (cell.hasClass('editable-cell') && row.is(rowBeingEdited)) {
                    return;
                } else if (cell.hasClass('editable-cell')) {
                    if (rowBeingEdited && !row.is(rowBeingEdited)) saveRow(rowBeingEdited);
                    rowBeingEdited = row;
                    row.find('.edit, .kanban, .dashboard').hide();
                    row.find('.save').show();
                    row.find('td.editable-cell').each(function() { makeCellEditable($(this)); });
                }
            });

            function makeCellEditable(cell) {
                const field = table.column(cell).dataSrc();
                const value = table.row(cell.closest('tr')).data()[field];
                let input;

                if (field === 'status') {
                    input = $(`<select class="form-select form-select-sm"></select>`);
                    Object.keys(statusConfig).forEach(status => input.append($('<option>', { value: status, text: status })));
                    input.val(value);
                } else if (field === 'lead') {
                    input = $(`<select class="form-select form-select-sm"></select>`);
                    teamMembers.forEach(member => input.append($('<option>', { value: member, text: member })));
                    input.val(value);
                } else {
                    input = $(`<input type="text" class="form-control form-control-sm" value="${value}">`);
                    if (field === 'targetEndDate') {
                        flatpickr(input[0], { dateFormat: "Y-m-d", defaultDate: value });
                    }
                }
                cell.html(input);
            }

            function saveRow(row) {
                const rowData = table.row(row).data();
                row.find('td.editable-cell').each(function() {
                    const field = table.column(this).dataSrc();
                    const input = $(this).find('input, select');
                    if (input.length) rowData[field] = input.val();
                });
                table.row(row).data(rowData).draw();
            }
        });
    </script>
</body>
</html>
