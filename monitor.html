<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitor - Superhero</title>
    <!-- Bootswatch Superhero Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/superhero/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --superhero-accent: #df691a;
            --superhero-dark-bg: #4e5d6c;
            --superhero-light-text: #ebf1f6;
            --superhero-column-bg: #373a3c;
        }

        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            background-color: var(--bs-body-bg);
        }

        body {
            font-family: 'Roboto Condensed', sans-serif;
        }

        .main-content {
            flex-grow: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .status-card {
            background-color: var(--superhero-column-bg);
            border: 1px solid var(--bs-gray-600);
            border-left: 5px solid; /* Status color will be applied here */
            color: var(--superhero-light-text);
            transition: all 0.2s ease-in-out;
            height: 100%;
        }

        .status-card .card-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .status-card .status-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .status-card .card-title {
            font-family: 'Orbitron', sans-serif;
        }

        .status-card .status-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 0.5rem;
        }

        .status-card .last-checked {
            font-size: 0.8rem;
            color: var(--bs-gray-500);
            margin-top: auto; /* Pushes to the bottom */
        }

        /* Status-specific colors */
        .status-ok { border-left-color: var(--bs-success); }
        .status-ok .status-icon { color: var(--bs-success); }
        .status-ok .status-text { color: var(--bs-success); }

        .status-degraded { border-left-color: var(--bs-warning); }
        .status-degraded .status-icon { color: var(--bs-warning); }
        .status-degraded .status-text { color: var(--bs-warning); }

        .status-outage { border-left-color: var(--bs-danger); }
        .status-outage .status-icon { color: var(--bs-danger); }
        .status-outage .status-text { color: var(--bs-danger); }

        footer {
            background-color: var(--bs-dark);
            color: var(--bs-gray-500);
            padding: 1rem;
            text-align: center;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#" style="font-family: 'Orbitron', sans-serif;">Kanban</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                         <a class="nav-link" href="#">Board</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="#">Add Task</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="projectDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Project Alpha
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="projectDropdown" id="projectList">
                           <li><a class="dropdown-item" href="#">Project Alpha</a></li>
                           <li><a class="dropdown-item" href="#">Project Beta</a></li>
                           <li><a class="dropdown-item" href="#">Project Gamma</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 style="font-family: 'Orbitron', sans-serif;">System Monitor</h1>
                <button class="btn btn-primary" id="refreshBtn"><i class="fas fa-sync-alt me-2"></i>Refresh Status</button>
            </div>
            <div class="row g-4">
                <!-- API 1 Card -->
                <div class="col-md-6">
                    <div class="card status-card" id="api1_card">
                        <div class="card-body">
                            <div class="status-icon" id="api1_icon"><i class="fas fa-server"></i></div>
                            <h4 class="card-title">Authentication API</h4>
                            <p class="status-text" id="api1_status">Checking...</p>
                            <p class="last-checked mt-3">Last checked: <span id="api1_timestamp">N/A</span></p>
                        </div>
                    </div>
                </div>

                <!-- API 2 Card -->
                <div class="col-md-6">
                    <div class="card status-card" id="api2_card">
                        <div class="card-body">
                            <div class="status-icon" id="api2_icon"><i class="fas fa-database"></i></div>
                            <h4 class="card-title">Data Processing API</h4>
                            <p class="status-text" id="api2_status">Checking...</p>
                            <p class="last-checked mt-3">Last checked: <span id="api2_timestamp">N/A</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark">
        <p class="mb-0">&copy; 2024 Kanban Project Management. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const refreshBtn = document.getElementById('refreshBtn');

            const api1 = {
                card: document.getElementById('api1_card'),
                icon: document.getElementById('api1_icon').querySelector('i'),
                statusText: document.getElementById('api1_status'),
                timestamp: document.getElementById('api1_timestamp')
            };

            const api2 = {
                card: document.getElementById('api2_card'),
                icon: document.getElementById('api2_icon').querySelector('i'),
                statusText: document.getElementById('api2_status'),
                timestamp: document.getElementById('api2_timestamp')
            };

            const statuses = [
                { text: 'Operational', className: 'status-ok', iconClass: 'fa-check-circle' },
                { text: 'Degraded Performance', className: 'status-degraded', iconClass: 'fa-exclamation-triangle' },
                { text: 'Outage', className: 'status-outage', iconClass: 'fa-times-circle' }
            ];

            function checkApiStatus(api) {
                // Stubbed function: randomly pick a status
                // In a real app, this would be an actual fetch() call
                const randomStatus = statuses[Math.floor(Math.random() * statuses.length)];

                // Update UI
                updateApiCard(api, randomStatus);
            }

            function updateApiCard(api, status) {
                // Clear existing status classes
                api.card.classList.remove('status-ok', 'status-degraded', 'status-outage');

                // Add new status class
                api.card.classList.add(status.className);

                // Update text and icon
                api.statusText.textContent = status.text;
                api.icon.className = `fas ${status.iconClass}`;

                // Update timestamp
                const now = new Date();
                api.timestamp.textContent = now.toLocaleTimeString();
            }

            function checkAllApis() {
                checkApiStatus(api1);
                checkApiStatus(api2);
            }

            // Event Listeners
            refreshBtn.addEventListener('click', checkAllApis);

            // Initial check on page load
            checkAllApis();

            // Optional: Auto-refresh every 30 seconds
            setInterval(checkAllApis, 30000);
        });
    </script>
</body>
</html>
